    scout: "@smol"
    docs-manager: "@smol"
    requirements-analyst: "@task"
    heavy-thinker: "@slow"
    cofounder: "@default"
    cto-advisor: "@default"
    impeccable-manual-edit-applier: "@default"
compaction:
  thresholdTokens: 200000
symbolPreset: nerd
composer:
  shape: band
theme:
  dark: titanium
dev:
  autoqaConsent: denied
retry:
  fallbackChains:
    web:
      - web/parallel
      - web/hosted
      - web/exa
      - web/firecrawl
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
    default:
      - google-antigravity/gemini-3.8-flash
      - opencode-go/deepseek-v4.1-flash
bashInterceptor:
  enabled: true
display:
  showTokenUsage: true
  cacheMissMarker: true
  hideToolActivity: false
lsp:
  diagnosticsOnEdit: true
skills:
  ignoredSkills:
    - browser-history
    - phone-harness
cycleOrder:
  - smol
  - slow
defaultThinkingLevel: auto