default_registry = 'skills.sh'

[github]
topics = ['agent-skills', 'claude-code', 'claude-skills', 'awesome-skills', 'claude-plugin']
keywords = []
per_page = 10

[skillssh]
base_url = 'https://skills.sh'
limit = 10

[sources]
[sources.'alchaincyf/huashu-design']
registry = 'github'
provider = 'git'
url = 'https://github.com/alchaincyf/huashu-design.git'
path = 'sources/alchaincyf--huashu-design'
ref = 'master'
installed = ['skills/huashu-design']

[sources.'anthropics/skills']
registry = 'github'
provider = 'git'
url = 'https://github.com/anthropics/skills.git'
path = 'sources/anthropics--skills'
ref = 'main'
installed = ['skills/frontend-design']

[sources.'morluto/rea']
registry = 'github'
