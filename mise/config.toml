[settings]
experimental = true
legacy_version_file_disable_tools = ['java']
idiomatic_version_file_enable_tools = ["node"]

[settings.npm]
package_manager = "pnpm"

[settings.pipx]
uvx = true

[settings.cargo]
binstall = true

[settings.github]
credential_command = "gh auth token"

[tools]
go = "1.27"
jq = "latest"
node = "24"
python = "3.14"
rust = "latest"
shellcheck = "latest"
uv = "latest"
yt-dlp = { version = "latest", rename_exe = "yt-dlp" }
yq = "latest"
neovim = "0.12"
rg = "latest"
starship = "latest"
zoxide = "latest"
delta = "latest"
usage = "latest"
bun = "latest"
kubectl = "latest"
pnpm = "latest"
"github:samhvw8/claude-code-profile" = { version = "latest", minimum_release_age = "0s" }
wrangler = "latest"
"pipx:it2" = "latest"
"npm:cf" = "latest"
claude = { version = "latest", minimum_release_age = "0s" }
gcloud = "584.0.0"
"npm:impeccable" = "latest"
"github:colbymchenry/codegraph" = { version = "latest", minimum_release_age = "0s" }
"pipx:fal" = "1.78.1"
antigravity-cli = "latest"
pandoc = "latest"
pi = "latest"
"npm:@companion-ai/feynman" = { version = "latest", trust_policy_excludes = ["pi-subagents@0.71.0"] }  # maintainer publishes manually since 0.37.2; 0.71.0 verified vs git tag 2026-09-25
"github:can1357/oh-my-pi" = { version = "latest", minimum_release_age = "0s" }
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }  # postinstall copies the platform binary into bin/
"npm:@rynfar/meridian" = "latest"
"github:Tencent/BrowserSkill" = { version = "latest", version_prefix = "cli-v" }
fzf = "latest"
fd = "latest"
bat = "latest"
atuin = "latest"
"pipx:nvitop" = { version = "latest", os = ["linux"] }
"pipx:huggingface_hub" = "latest"
gh = "latest"
"github:sharkdp/hyperfine" = "latest"
"pipx:cua-cli" = { version = "latest", uvx_args = "--python 3.13" }

# Full install. Shared dotfiles and bootstrap entries are in conf.d/dotfiles.toml.
[dotfiles]
"~/.config/mise/config.toml" = { source = "~/.dotfiles/mise/config.toml", mode = "symlink" }
"~/.zshrc" = { source = "~/.dotfiles/home/.zshrc", mode = "symlink" }

[bootstrap.packages]
"apt:python3-pip" = "latest"
"apt:gnupg" = "latest"
"apt:ca-certificates" = "latest"
"apt:software-properties-common" = "latest"
"apt:build-essential" = "latest"
"apt:terminator" = "latest"
"apt:zip" = "latest"

[bootstrap.repos]
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm" }

[bootstrap.hooks]
post-tools = [
    # ~/.claude belongs to ccp (`ccp use -g` repoints it), so it is not a
    # [dotfiles] entry; this only creates it when missing.
    "mise exec -- bash $HOME/.dotfiles/mise/scripts/setup-ccp.sh",
    "mise exec -- bash $HOME/.dotfiles/mise/scripts/setup-claude-mcp.sh",
    "bash $HOME/.dotfiles/mise/scripts/setup-font-linux.sh",
]


# cua-driver is not a [tools] entry; mise/scripts/cua-driver.sh explains why.
[tasks."cua:install"]
description = "Install or upgrade cua-driver with its own installer and register its MCP server"
alias = "cua:update"
run = "bash $HOME/.dotfiles/mise/scripts/cua-driver.sh"
