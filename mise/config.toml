[settings]
experimental = true
legacy_version_file_disable_tools = ['java']
idiomatic_version_file_enable_tools = ["node"]

[settings.npm]
package_manager = "aube"

[settings.pipx]
uvx = true

[settings.cargo]
binstall = true

[tools]
direnv = "latest"
go = "1.27.1"
jq = "latest"
k6 = "latest"
node = "22"
python = "3.11"
ripgrep = "latest"
rust = "latest"
zig = "0.11.0"
shellcheck = "latest"
shfmt = "latest"
uv = "latest"
yt-dlp = { version = "latest", rename_exe = "yt-dlp" }
yq = "latest"
neovim = "0.11.4"
lazygit = "latest"
dasel = "latest"
hurl = "latest"
rg = "latest"
cloudflared = "latest"
ast-grep = "latest"
starship = "latest"
zoxide = "latest"
delta = "latest"
usage = "latest"
"forgejo:mergiraf/mergiraf" = "0.17.0"
bun = "latest"
jnv = "latest"
"npm:mcp-chrome-bridge" = "latest"
rclone = "latest"
git-lfs = "latest"
kubectl = "latest"
k9s = "latest"
pnpm = "latest"
"github:samhvw8/claude-code-profile" = { version = "latest", minimum_release_age = "0s" }
"npm:playwriter" = "latest"
vhs = "latest"
zellij = "latest"
"github:pinchtab/pinchtab" = "latest"
wrangler = "latest"
"pipx:it2" = "latest"
"npm:cf" = "latest"
claude = { version = "latest", minimum_release_age = "0s" }
gcloud = "584.0.0"
aube = "latest"
flyctl = "latest"
firebase = "15.17.0"
opengrep = "latest"
"github:Ataraxy-Labs/weave" = { version = "latest", matching = "weave-cli", exe = "weave" }
"http:weave-driver" = { version = "v0.3.6", url = "https://github.com/Ataraxy-Labs/weave/releases/download/{{ version }}/weave-driver-{{ arch(arm64=\"aarch64\", x64=\"x86_64\") }}-{{ os(macos=\"apple-darwin\", linux=\"unknown-linux-gnu\") }}.tar.gz", exe = "weave-driver" }
"http:weave-mcp" = { version = "v0.3.6", url = "https://github.com/Ataraxy-Labs/weave/releases/download/{{ version }}/weave-mcp-{{ arch(arm64=\"aarch64\", x64=\"x86_64\") }}-{{ os(macos=\"apple-darwin\", linux=\"unknown-linux-gnu\") }}.tar.gz", exe = "weave-mcp" }
"npm:impeccable" = "latest"
"github:colbymchenry/codegraph" = { version = "latest", minimum_release_age = "0s" }
"github:Ataraxy-Labs/sem" = { version = "latest", minimum_release_age = "0s" }
"pipx:fal" = "1.78.1"
"pipx:git+https://github.com/wassermanproductions/unofficial-davinci-mcp.git" = "latest"
"github:max-sixty/worktrunk" = "latest"
antigravity-cli = "latest"
pandoc = "3.9.0.2"
pi = "latest"
"npm:@companion-ai/feynman" = "latest"
"github:can1357/oh-my-pi" = { version = "latest", minimum_release_age = "0s" }
opencode = "latest"
ruff = "latest"
"npm:@rynfar/meridian" = "latest"
"github:Tencent/BrowserSkill" = { version = "latest", version_prefix = "cli-v" }

# Full install. Shared dotfiles and bootstrap entries are in conf.d/dotfiles.toml.
[dotfiles]
"~/.config/mise/config.toml" = { source = "~/.dotfiles/mise/config.toml", mode = "symlink" }
"~/.zshrc" = { source = "~/.dotfiles/home/.zshrc", mode = "symlink" }

[bootstrap.packages]
"apt:python3-pip" = "latest"
"apt:gnupg" = "latest"
"apt:ca-certificates" = "latest"
"apt:software-properties-common" = "latest"
"apt:build-essential" = "latest"
"apt:terminator" = "latest"
"apt:zip" = "latest"

[bootstrap.repos]
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm" }

[bootstrap.hooks]
post-tools = [
    # ~/.claude belongs to ccp (`ccp use -g` repoints it), so it is not a
    # [dotfiles] entry; this only creates it when missing.
    "mise exec -- bash $HOME/.dotfiles/mise/scripts/setup-ccp.sh",
    "mise exec -- bash $HOME/.dotfiles/mise/scripts/setup-claude-mcp.sh",
    "bash $HOME/.dotfiles/mise/scripts/setup-font-linux.sh",
]
