# Mise Configuration - Minimal Mode (Server/Lightweight)

[settings]
experimental = true
legacy_version_file_disable_tools = ['java']
idiomatic_version_file_enable_tools = ["node"]

[tools]
# Essential tools
jq = "latest"
ripgrep = "latest"
yq = "latest"

# Server essentials
node = "22"
python = "3.11"
uv = "latest"

# Minimal install. Shared dotfiles and bootstrap entries are in conf.d/dotfiles.toml.
[dotfiles]
"~/.config/mise/config.toml" = { source = "~/.dotfiles/mise/minimal.toml", mode = "symlink" }
"~/.zshrc" = { source = "~/.dotfiles/home/.zshrc_minimal", mode = "symlink" }
