# Dotfiles and machine setup shared by the full and minimal installs.
#
# ~/.config/mise/config.toml links to mise/config.toml (full) or
# mise/minimal.toml (minimal); this file is linked into
# ~/.config/mise/conf.d/ on both. Apply everything with `mise bootstrap`,
# or only the files with `mise dot apply`.
#
# Machine-local values live in ~/.config/mise/config.local.toml, which is
# never committed:
#
#   [vars]
#   git_name = "Your Name"
#   git_email = "you@example.com"

[dotfiles]
# Every file committed under these home/ directories is linked to the same path
# under ~. Each directory is its own entry: a single "~" entry makes mise walk
# the whole home directory (minutes, with ~/workspace) on every status or apply.
"~/.ccp" = { source = "~/.dotfiles/home/.ccp", mode = "symlink-each", manifest = "git" }
"~/.config" = { source = "~/.dotfiles/home/.config", mode = "symlink-each", manifest = "git" }
"~/.local/bin" = { source = "~/.dotfiles/home/.local/bin", mode = "symlink-each", manifest = "git" }

# Files directly in home/. ~/.zshrc differs between installs, so each config
# declares it.
"~/.base.gitconfig" = { source = "~/.dotfiles/home/.base.gitconfig", mode = "symlink" }
"~/.condarc" = { source = "~/.dotfiles/home/.condarc", mode = "symlink" }
"~/.envrc" = { source = "~/.dotfiles/home/.envrc", mode = "symlink" }
"~/.gitattributes" = { source = "~/.dotfiles/home/.gitattributes", mode = "symlink" }
"~/.gitignore" = { source = "~/.dotfiles/home/.gitignore", mode = "symlink" }
"~/.ideavimrc" = { source = "~/.dotfiles/home/.ideavimrc", mode = "symlink" }
"~/.profile" = { source = "~/.dotfiles/home/.profile", mode = "symlink" }
"~/.tmux.conf" = { source = "~/.dotfiles/home/.tmux.conf", mode = "symlink" }
"~/.wslconfig" = { source = "~/.dotfiles/home/.wslconfig", mode = "symlink" }
"~/.zprofile" = { source = "~/.dotfiles/home/.zprofile", mode = "symlink" }
"~/.zshrc_minimal" = { source = "~/.dotfiles/home/.zshrc_minimal", mode = "symlink" }
"~/terminator.vbs" = { source = "~/.dotfiles/home/terminator.vbs", mode = "symlink" }

"~/.config/mise/conf.d/dotfiles.toml" = { source = "~/.dotfiles/mise/conf.d/dotfiles.toml", mode = "symlink" }

# ~/.gitconfig is also written by `git config --global` and `gh auth
# setup-git`, so only these blocks are managed.
"~/.gitconfig/identity" = { source = "~/.dotfiles/mise/snippets/git-identity.tera", template = "tera" }
"~/.gitconfig/base" = { block = "[include]\n\tpath = ~/.base.gitconfig" }

[bootstrap.packages]
"brew:telnet" = { os = "macos" }
"brew:wget" = { os = "macos" }
"brew:sshuttle" = { os = "macos" }
"brew:htop" = { os = "macos" }
"brew-cask:macfuse" = { os = "macos" }
"brew-cask:calibre" = { os = "macos" }
"brew-cask:iterm2" = { os = "macos" }
"apt:tmux" = "latest"
"apt:vim" = "latest"
"apt:git" = "latest"
"apt:zsh" = "latest"
"apt:wget" = "latest"
"apt:curl" = "latest"
"apt:net-tools" = "latest"
"apt:unzip" = "latest"
"apt:aptitude" = "latest"
"apt:apt-transport-https" = "latest"

[bootstrap.repos]
"~/.fzf" = { url = "https://github.com/junegunn/fzf.git" }

# Hooks run on every `mise bootstrap`, so each script skips work already done.
[bootstrap.hooks]
pre-packages = "bash $HOME/.dotfiles/mise/scripts/prepare-host.sh"
post-packages = "bash $HOME/.dotfiles/mise/scripts/finish-host.sh"
post-repos = "bash $HOME/.dotfiles/mise/scripts/setup-fzf.sh"
